services:
  - type: web
    name: 7games
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GAM_REWARDED_UNIT
        sync: false
      # Google AdSense (publisher id ca-pub-… and a responsive display ad unit id)
      - key: VITE_ADSENSE_CLIENT
        sync: false
      - key: VITE_ADSENSE_SLOT
        sync: false
    routes:
      # SPA fallback: serve index.html for any path without a file extension
      - type: rewrite
        source: /.*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
